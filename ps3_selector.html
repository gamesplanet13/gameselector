<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PS3 Game Selector – Games Planet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;display=swap" rel="stylesheet"/>
<style>
    :root { color-scheme: dark; --bg:#080b12; --panel:#121826; --line:#26334b; --blue:#2d7dff; --green:#20c77a; --text:#f6f8fc; --muted:#9ca9bd; }
    * { box-sizing: border-box; }
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    body { font-family: Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); padding-bottom: 178px; }
    button, input, select { font: inherit; max-width: 100%; }
    h1 { text-align: center; }
    .brand { background:linear-gradient(135deg,#05070c,#17233b); padding:14px 12px; text-align:center; border-bottom:1px solid var(--line); }
    .page-shell { width:min(100% - 24px, 980px); margin:0 auto; }
    .subtitle { text-align:center; margin:16px 0 12px; font-size:clamp(17px,4vw,22px); font-weight:700; line-height:1.3; }
    .form-grid, .filter-grid { display:grid; gap:10px; grid-template-columns:repeat(3,minmax(0,1fr)); margin-bottom:12px; }
    .filter-grid { grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)); }
    input, select { width:100%; min-width:0; min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--text); outline:none; }
    input:focus, select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(45,125,255,.18); }
    .storage-control { display:grid; grid-template-columns:1fr; gap:6px; min-width:0; }
    .storage-control.manual-active { grid-template-columns:1fr 1fr; }
    [hidden] { display:none !important; }
    .search-wrap { position:relative; min-width:0; }
    .search-wrap input { padding-right:42px; }
    .clear-search { position:absolute; right:5px; top:5px; width:34px; min-height:34px; padding:0; border:0; border-radius:8px; background:transparent; color:var(--muted); font-size:22px; }
    .results-info { color:var(--muted); font-size:13px; margin:4px 2px 10px; }
    .game-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:18px; }
    .game-item { min-width:0; background:var(--panel); padding:8px 10px; border-radius:10px; border:1px solid var(--line); cursor:pointer; transition:.15s; overflow-wrap:anywhere; line-height:1.2; }
    .game-item:hover { border-color:#4d6388; transform:translateY(-1px); }
    .game-item.selected { background:#123727; border-color:var(--green); box-shadow:inset 4px 0 var(--green); }
    .game-name { display:block; font-weight:700; font-size:14px; }
    .game-size { display:block; color:var(--muted); font-size:10px; line-height:1.1; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .empty-state { grid-column:1/-1; padding:30px 15px; text-align:center; background:var(--panel); border:1px dashed var(--line); border-radius:12px; color:var(--muted); }
    .progress-wrap { margin:4px 0 14px; }
    .progress-track { height:10px; background:#222b3b; border-radius:99px; overflow:hidden; }
    #progressBar { height:100%; width:0; background:var(--green); transition:width .2s; }
    #progressLabel { font-size:12px; margin-bottom:5px; color:var(--muted); }
    .footer { position:fixed; z-index:20; bottom:0; left:0; right:0; background:rgba(12,16,25,.97); padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); box-shadow:0 -4px 18px rgba(0,0,0,.35); border-top:1px solid var(--line); }
    .footer .info-line { font-size:12px; text-align:center; margin-bottom:4px; white-space:normal; overflow-wrap:anywhere; }
    .footer-actions, .more-menu { display:grid; gap:6px; width:min(100%,680px); margin:auto; }
    .footer-actions { grid-template-columns:1fr 1fr; }
    .footer-actions .whatsapp-primary { grid-column:1/-1; background:#16a765; font-size:15px; font-weight:700; }
    .footer-actions .whatsapp-primary:hover { background:#118653; }
    .more-menu { grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:6px; padding:7px; border:1px solid var(--line); border-radius:10px; background:#151c2a; }
    .more-menu[hidden] { display:none; }
    .footer button { min-width:0; min-height:38px; padding:7px 4px; font-size:12px; border:0; border-radius:8px; background:var(--blue); color:white; cursor:pointer; }
    .reset-button { background:#8f2e3a !important; }
    .more-button { background:#34445f !important; }
    .footer button:hover { background:#1768df; }
    @keyframes flashTitle {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }
    .flash { animation: flashTitle 1s infinite; }
    @media (max-width: 680px) {
      body { padding-bottom:178px; }
      .page-shell { width:min(100% - 16px,980px); }
      .form-grid, .filter-grid { grid-template-columns:1fr; }
      .game-list { grid-template-columns:1fr; gap:8px; }
      .more-menu { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 360px) { .footer button { font-size:11px; } }
    @media (prefers-reduced-motion: reduce) { .flash { animation:none; } .game-item { transition:none; } }
  </style>
</head>
<body>
<div class="brand">
<h1 class="flash" style="font-family: 'Orbitron', sans-serif; color: white; font-size: 32px; margin: 0;">GAMES PLANET</h1>
</div>
<main class="page-shell">
<div class="subtitle">PS3 Game List – Select Your Favorite Games</div>
<div class="form-grid">
<input id="customerName" autocomplete="name" placeholder="Customer Name" type="text"/>
<input id="customerMobile" autocomplete="tel" inputmode="numeric" maxlength="10" placeholder="Mobile Number" type="tel"/>
<div class="storage-control" id="storageControl">
  <select id="storageProfile" aria-label="PS3 storage type">
    <option value="400" selected>500GB PS3 — 400GB Games</option>
    <option value="800">1TB PS3 — 800GB Games</option>
    <option value="450">500GB USB — 450GB Games</option>
    <option value="900">1TB USB — 900GB Games</option>
    <option value="manual">Enter Size Manually</option>
  </select>
  <input id="manualStorage" type="number" inputmode="decimal" min="1" step="1" placeholder="Usable GB" hidden/>
</div>
</div>
<div class="progress-wrap">
  <div id="progressLabel">Used: 0 GB of 400 GB</div>
  <div class="progress-track"><div id="progressBar"></div></div>
</div>
<div class="filter-grid">
<div class="search-wrap"><input id="searchBox" autocomplete="off" placeholder="Search any game..." type="search"/><button class="clear-search" id="clearSearch" aria-label="Clear search" type="button">×</button></div>
<select id="categoryFilter" aria-label="Game category">
<option value="">All Categories</option>
<option value="Action">Action</option>
<option value="Adventure">Adventure</option>
<option value="Open-World Action-Adventure">Open-World Action-Adventure</option>
<option value="Fighting">Fighting</option>
<option value="Racing">Racing</option>
<option value="Shooter">Shooter</option>
<option value="Sports">Sports</option>
<option value="Other">Other</option>
</select>
<select id="sizeFilter" aria-label="Game size">
<option value="">All Sizes</option>
<option value="&lt;5GB">&lt;5GB</option>
<option value="5-10GB">5–10GB</option>
<option value="10-20GB">10–20GB</option>
<option value="20-30GB">20–30GB</option>
<option value="30GB+">30GB+</option>
</select>
<select id="playerFilter" aria-label="Player mode">
<option value="">All Player Modes</option>
<option value="single">Offline Single Player</option>
<option value="multi">Offline Multiplayer</option>
</select>
</div>
<div class="results-info" id="resultsInfo"></div>
<div class="game-list" id="gameList"></div>
</main>
<div class="footer">
<div class="info-line" id="summaryInfo"></div>
<div class="info-line" id="storageBarInfo" style="font-size: 10px; color: #666;"></div>
<div class="more-menu" id="moreMenu" hidden>
  <button onclick="printPlainText()">Print</button>
  <button onclick="saveAsPDF()">PDF</button>
  <button onclick="sendEmail()">Email</button>
  <button onclick="sendSMS()">SMS</button>
</div>
<div class="footer-actions">
  <button class="whatsapp-primary" onclick="sendWhatsApp()">Send Selected List on WhatsApp</button>
  <button class="reset-button" id="resetSelection" type="button">Reset Selection</button>
  <button class="more-button" id="moreButton" type="button" aria-expanded="false" aria-controls="moreMenu">More</button>
</div>
</div>

  const SELECTION_STORAGE_KEY = "gamesPlanet.ps3.selectedGames.v1";
  let selectedGames = [];

  try {
    const savedSelection = JSON.parse(localStorage.getItem(SELECTION_STORAGE_KEY) || "[]");
    if (Array.isArray(savedSelection)) {
      selectedGames = [...new Set(savedSelection)]
        .map(Number)
        .filter(index => Number.isInteger(index) && index >= 0 && index < games.length);
    }
  } catch (error) {
    selectedGames = [];
  }

  function saveSelection() {
    try { localStorage.setItem(SELECTION_STORAGE_KEY, JSON.stringify(selectedGames)); } catch (error) {}
  }

  function normalizeSearch(value) {
    return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().replace(/\.iso$/i, "").replace(/[^a-z0-9]+/g, " ").trim();
  }

  function getSizeGroup(size) {
    if (size < 5) return "<5GB";
    if (size < 10) return "5-10GB";
    if (size < 20) return "10-20GB";
    if (size < 30) return "20-30GB";
    return "30GB+";
  }

  function getStorageLimit() {
    const profile = document.getElementById("storageProfile").value;
    if (profile === "manual") {
      return Math.max(0, parseFloat(document.getElementById("manualStorage").value) || 0);
    }
    return parseFloat(profile) || 0;
  }

  function getGameCategory(game) {
    const name = normalizeSearch(game.name);
    const has = pattern => pattern.test(name);

    if (has(/\b(grand theft auto|gta|red dead redemption|assassins creed|assassin s creed|batman arkham city|batman arkham origins|far cry|watch dogs|saints row|sleeping dogs|just cause|infamous|prototype|l a noire|la noire|mafia|skyrim|elder scrolls|metal gear solid v|phantom pain|amazing spider man|spiderman 3|spider man 3|godfather|yakuza)\b/)) return "Open-World Action-Adventure";
    if (has(/\b(tekken|takken|mortal kombat|street fighter|super steer fighter|king of fighters|soulcalibur|soul calibur|virtua fighter|dead or alive|naruto|wwe|smackdown|wrestl|ufc|fight night|dragon ball|dragonball|marvel vs|capcom vs|persona 4 arena|injustice|jojo|blazblue)\b/)) return "Fighting";
    if (has(/\b(fifa|pes|pro evolution|football|soccer|nba|nfl|nhl|mlb|cricket|rugby|tennis|golf|olympic|baseball|basketball|volleyball|skate|snowboard|ssx|sports?|backbreaker)\b/)) return "Sports";
    if (has(/\b(gran turismo|need for speed|burnout|midnight club|racing|racer|race|rally|motogp|formula|nascar|motorstorm|superbike|cars?|kart|drift|grid|dirt|blur|sonic all stars racing|split second|ridge racer|wrc)\b/)) return "Racing";
    if (has(/\b(call of duty|medal of honor|battlefield|bioshock|borderlands|killzone|sniper|shooter|ghost recon|army of two|binary domain|resistance|fear|doom|wolfenstein|destiny|far cry|crysis|rage|spec ops|operation flashpoint|homefront|aliens colonial|alien vs predator|max payne)\b/)) return "Shooter";
    if (has(/\b(uncharted|last of us|tomb raider|resident evil|silent hill|god of war|prince of persia|ratchet|sly cooper|lego|final fantasy|castlevania|devil may cry|dark souls|darksiders|dead space|heavy rain|beyond two souls|littlebigplanet|rayman|sonic|alice madness|arcania|dragon age|mass effect|ni no kuni)\b/)) return "Adventure";
    if (has(/\b(singstar|guitar hero|rock band|dance|karaoke|buzz|littlebigplanet karting|minecraft|angry birds|monopoly|poker|pinball|collection|trilogy)\b/)) return "Other";
    return "Action";
  }

  function getPlayerInfo(game) {
    const name = normalizeSearch(game.name);
    const has = pattern => pattern.test(name);

    // Only simultaneous offline/local play is counted here. Online-only and
    // pass-the-controller modes intentionally remain 1 Player.
    if (has(/\b(fifa|pes|pro evolution|nba 2k)\b/)) {
      return { mode: "multi", max: 7, label: "Offline: 1–7 Players" };
    }
    if (has(/\b(wwe|smack down|smackdown)\b/)) {
      return { mode: "multi", max: 6, label: "Offline: 1–6 Players" };
    }
    if (has(/\b(blur|sonic all stars racing|motorstorm apocalypse|littlebigplanet|rayman origins|minecraft|diablo iii|ratchet.*all 4 one|playstation all stars|call of duty black ops|black ops ii)\b/)) {
      return { mode: "multi", max: 4, label: "Offline: 1–4 Players" };
    }
    if (has(/\b(tekken|takken|mortal kombat|street fighter|super steer fighter|king of fighters|soulcalibur|soul calibur|virtua fighter|injustice|naruto|ufc|fight night|dragon ball|dragonball|persona 4 arena|jojo|blazblue|army of two|borderlands 2|portal 2|resident evil 5|resident evil 6|gran turismo 6|need for speed pro street|lego|dynasty warriors|samurai warriors|ben 10|splinter cell blacklist|far cry 3|guitar hero|rock band|singstar|virtua tennis|top spin)\b/)) {
      return { mode: "multi", max: 2, label: "Offline: 1–2 Players" };
    }
    return { mode: "single", max: 1, label: "Offline: 1 Player" };
  }

  function filterGames() { renderGames(); }

  function renderGames() {
    const list = document.getElementById("gameList");
    const terms = normalizeSearch(document.getElementById("searchBox").value).split(/\s+/).filter(Boolean);
    const category = document.getElementById("categoryFilter").value;
    const sizeGroup = document.getElementById("sizeFilter").value;
    const playerMode = document.getElementById("playerFilter").value;
    list.innerHTML = "";
    let visibleCount = 0;

    games.forEach((game, index) => {
      const matchesSearch = terms.every(term => normalizeSearch(game.name).includes(term));
      const matchesCategory = !category || getGameCategory(game) === category;
      const matchesSize = !sizeGroup || getSizeGroup(game.size) === sizeGroup;
      const playerInfo = getPlayerInfo(game);
      const matchesPlayers = !playerMode || playerInfo.mode === playerMode;
      if (!matchesSearch || !matchesCategory || !matchesSize || !matchesPlayers) return;

      visibleCount++;
      const item = document.createElement("div");
      item.className = "game-item" + (selectedGames.includes(index) ? " selected" : "");
      item.setAttribute("role", "button");
      item.setAttribute("tabindex", "0");
      item.setAttribute("aria-pressed", selectedGames.includes(index) ? "true" : "false");
      const displayName = game.name.replace(/\.iso$/i, "");
      const name = document.createElement("span");
      name.className = "game-name";
      name.textContent = displayName;
      const size = document.createElement("span");
      size.className = "game-size";
      size.textContent = `${game.size} GB • ${getGameCategory(game)} • ${playerInfo.label}`;
      item.append(name, size);
      item.onclick = () => toggleGame(index, item);
      item.onkeydown = event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggleGame(index, item);
        }
      };
      list.appendChild(item);
    });

    if (!visibleCount) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No game found. Try another spelling or remove a filter.";
      list.appendChild(empty);
    }
    document.getElementById("resultsInfo").textContent = `Showing ${visibleCount} of ${games.length} games`;
  }

  function toggleGame(index, element) {
    const isSelected = selectedGames.includes(index);
    if (isSelected) {
      selectedGames = selectedGames.filter(i => i !== index);
      element.classList.remove("selected");

let speechQueue = null;
function speak(text) {
  if (speechQueue) window.speechSynthesis.cancel();
  speechQueue = new SpeechSynthesisUtterance(text);
  window.speechSynthesis.speak(speechQueue);
}

function toggleGame(index, element) {
  const isSelected = selectedGames.includes(index);
  const storageLimit = getStorageLimit();
  const currentSelectedSize = selectedGames.reduce((sum, i) => sum + games[i].size, 0);
  const thisGameSize = games[index].size;

  if (!isSelected && (currentSelectedSize + thisGameSize > storageLimit)) {
    speak("Storage limit exceeded");
    return;
  }

  if (isSelected) {
    selectedGames = selectedGames.filter(i => i !== index);
    element.classList.remove("selected");
    element.setAttribute("aria-pressed", "false");
  } else {
    selectedGames.push(index);
    element.classList.add("selected");
    element.setAttribute("aria-pressed", "true");
  }

  saveSelection();
  updateSummary();
  updateStorageBar();
  speak(String(selectedGames.length));

  const used = selectedGames.reduce((sum, i) => sum + games[i].size, 0);
  const remaining = getStorageLimit() - used;
  if (remaining <= 5 && remaining > 0) {
    if (remaining <= 1) {
      speak("Last 1 GB remaining");
    } else {
      speak(`Only ${remaining.toFixed(1)} GB left`);
    }
  }
}

  document.getElementById("summaryInfo").innerText =
    `Total Games: ${totalGames} (${totalGameSize} GB) | Selected: ${selectedCount} (${selectedSize} GB)`;

  const storage = getStorageLimit();
  const percent = (selectedSize / storage) * 100;
  const bar = document.getElementById("progressBar");
  const label = document.getElementById("progressLabel");

  bar.style.width = `${Math.min(percent, 100)}%`;
  if (percent < 80) {
    bar.style.background = "green";
  } else if (percent >= 100) {
    bar.style.background = "red";
  } else {
    bar.style.background = "orange";
  }
  label.innerText = `Used: ${selectedSize} GB of ${storage} GB`;
};


function updateStorageBar() {
  const selectedSize = selectedGames.reduce((sum, i) => sum + games[i].size, 0);
  const totalSize = getStorageLimit();
  const usedPercent = totalSize > 0 ? Math.min((selectedSize / totalSize) * 100, 100) : 0;

  document.getElementById("storageBarInfo").innerText =
    `Used: ${selectedSize.toFixed(2)} GB of ${totalSize} GB (${usedPercent.toFixed(0)}%)`;
}
